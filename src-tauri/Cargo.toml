[package]
name = "frp_desktop"
version = "0.1.9"
description = "frpc 图形化客户端 + frps dashboard 查看，跨平台桌面应用"
authors = ["jamiu99"]
license = "MIT"
repository = "https://github.com/jamiu99/frp-desktop"
edition = "2021"
default-run = "frp_desktop"

[[bin]]
name = "frp_desktop"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "frp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
netstat2 = "0.11"
sysinfo = "0.32"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex-lite = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = "0.3"
interprocess = { version = "=2.4.4", features = ["tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
toml = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
widestring = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

